<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <title>OG cover 1200x630 — Sponsorship</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Plantilla para exportar images/og-cover.png (1200x630).
       Abrir este archivo en el navegador y capturar SOLO el rectángulo .og
       (en DevTools: click derecho sobre el nodo .og > "Capture node screenshot").
       Reemplazar por una captura real del producto cuando estén los datos de demo. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #17181c;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', system-ui, sans-serif;
    }
    .og {
      width: 1200px;
      height: 630px;
      position: relative;
      overflow: hidden;
      background: #0C0C0E;
      color: #EDEDED;
      padding: 76px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .og::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(700px 380px at 12% 0%, rgba(255,199,0,.22), transparent 62%),
        radial-gradient(560px 320px at 92% 8%, rgba(255,199,0,.14), transparent 68%),
        radial-gradient(520px 300px at 70% 108%, rgba(255,199,0,.10), transparent 70%);
      filter: blur(6px);
    }
    .og > * { position: relative; }

    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: 2px; font-size: 26px; }
    .brand span:first-child { color: #FFC700; font-size: 30px; }

    h1 {
      font-size: 68px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -.02em;
      max-width: 15ch;
    }
    .grad {
      background: linear-gradient(180deg, #FFE070 0%, #FFC700 60%, #EAB308 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .facts { display: flex; gap: 16px; }
    .facts div {
      border: 1px solid #2C2C2F;
      border-radius: 16px;
      background: rgba(255,255,255,.04);
      padding: 16px 22px;
    }
    .facts b { display: block; color: #FFC700; font-size: 26px; font-weight: 900; line-height: 1.2; }
    .facts small { color: #B5B5BA; font-size: 16px; font-weight: 600; }

    .foot { display: flex; justify-content: space-between; align-items: flex-end; }
    .url { color: #B5B5BA; font-size: 20px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="og">
    <div class="brand"><span>◆</span><span>SPONSORSHIP</span></div>

    <h1>Conectá marcas y creadores <span class="grad">en Argentina</span></h1>

    <div class="foot">
      <div class="facts">
        <div><b>5%</b><small>de comisión</small></div>
        <div><b>Mercado Pago</b><small>cobro directo</small></div>
        <div><b>$ ARS</b><small>todo en pesos</small></div>
      </div>
      <div class="url">sponsorship.blog</div>
    </div>
  </div>
</body>
</html>
